[project]
name = "winphone-android"
version = "0.1.0"
description = "WINPHONE Android adapter (adb, scrcpy)"
requires-python = ">=3.11"
dependencies = ["winphone-core", "adbutils>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winphone_android"]

[tool.uv.sources]
winphone-core = { workspace = true }
