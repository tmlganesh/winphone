[project]
name = "winphone-ios"
version = "0.1.0"
description = "WINPHONE iPhone adapter for Windows (usbmuxd, go-ios)"
requires-python = ">=3.11"
dependencies = ["winphone-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winphone_ios"]

[tool.uv.sources]
winphone-core = { workspace = true }
