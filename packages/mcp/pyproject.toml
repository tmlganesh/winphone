[project]
name = "winphone-mcp"
version = "0.1.0"
description = "WINPHONE MCP server (stdio) for Claude Code and other agents"
requires-python = ">=3.11"
dependencies = ["winphone-core", "mcp>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winphone_mcp"]

[tool.uv.sources]
winphone-core = { workspace = true }
