[project]
name = "winphone-core"
version = "0.1.0"
description = "WINPHONE device orchestrator, models and local daemon"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winphone_core"]
